name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The KB repo updates independently of this site, so rebuild on a timer to
  # pick up new facts. Bounded at 8 builds/day rather than one per KB commit —
  # the reference branch took 68 commits in a single day.
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # The build-time sync pulls knomit's OpenAPI spec from the public knomit
      # repo — no token needed. Pin KNOMIT_REF to a tag/SHA once one exists;
      # `master` (the default branch) is the fallback until then.
      KNOMIT_REF: ${{ vars.KNOMIT_REF || 'master' }}
      # REQUIRED, despite every repo the sync touches being public. The release
      # lookup for /download hits api.github.com, whose UNAUTHENTICATED limit is
      # 60 requests/hour PER IP — shared with every other Actions job on the
      # same runner address, so it is exhausted by strangers at unpredictable
      # times. Without this the call 403s intermittently, sync.mjs falls back to
      # a page with no downloads on it (by design — it must not break the
      # build), and the /download e2e tests fail on a green change. The
      # automatic token lifts this to 1000/hour for the repository and needs no
      # secret to be configured. Read-only `contents: read` is enough to list
      # releases on a public repo.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      KB_REPO_SLUG: ${{ vars.KB_REPO_SLUG || 'knomit/agentic-engineering-kb' }}
      # The agent branch name encodes a hostname; keep it a repo variable so
      # retargeting needs no code change.
      KB_REF: ${{ vars.KB_REF || 'agent/mindev.local-8ef0cd32' }}
      SITE_URL: https://knomit.io
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Must run before the unit tests: src/generated/kb-ui/ is gitignored and
      # only exists after this step's sync runs, and bundleApi.ts imports from
      # it at module scope. Running the tests first also meant the
      # upstream-drift contract test (bundleApi.contract.test.ts) validated
      # yesterday's vendor against today's bundleApi — the one test that's
      # supposed to catch drift couldn't see it from there.
      - name: Build (runs prebuild sync)
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Type & content check
        run: npm run check

      # Hand the built site to the deploy job (main pushes only) so it ships the
      # exact artifact CI validated — no rebuild, no drift.
      - name: Upload built site
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Ship to Cloudflare Pages only after build/check/tests pass, and only for
  # pushes to main, a scheduled rebuild, or a manual dispatch — never PRs.
  # `needs` is the gate; the `if` scopes it to prod.
  deploy:
    needs: build-and-test
    if: >-
      ${{ github.event_name == 'schedule'
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
          || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=knomit-io --branch=main
